# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
registries:
  dhi:
    type: docker-registry
    url: https://dhi.io
    username: ${{secrets.DOCKER_USER}}
    password: ${{secrets.DOCKER_PAT}}
    replaces-base: true
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    assignees:
      - "mkaraki"
    groups:
      github-actions-all:
        patterns:
          - "*"

  - package-ecosystem: "composer"
    directory: "/imageViewer/"
    schedule:
      interval: "monthly"
    assignees:
      - "mkaraki"
    groups:
      composer-all:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/imageViewer/"
    schedule:
      interval: "monthly"
    assignees:
      - "mkaraki"
    groups:
      npm-all:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/imageViewer/"
    schedule:
      interval: "monthly"
    assignees:
      - "mkaraki"
    registries: "*"
    groups:
      docker-imageViewer:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/imageEvaller/"
    schedule:
      interval: "monthly"
    assignees:
      - "mkaraki"
    registries: "*"
    groups:
      docker-imageEvaller:
        patterns:
          - "*"

  - package-ecosystem: "uv"
    directory: "/imageEvaller/"
    schedule:
      interval: "monthly"
    assignees:
      - "mkaraki"
    groups:
      uv-all:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/imageServer/"
    schedule:
      interval: "monthly"
    assignees:
      - "mkaraki"
    registries: "*"
    groups:
      docker-imageServer:
        patterns:
          - "*"

  - package-ecosystem: "cargo"
    directory: "/imageServer/"
    schedule:
      interval: "monthly"
    assignees:
      - "mkaraki"
    groups:
      cargo-all:
        patterns:
          - "*"
