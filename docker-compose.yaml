services:
  runner:
    build: imageEvaller
    volumes:
      - ./imageEvaller/models:/usr/src/app/models:ro
      - ./imageEvaller/images:/usr/src/app/images:ro
    environment:
      - CUDA_VISIBLE_DEVICES=""
    depends_on:
      - db

  viewer:
    build: imageViewer
    volumes:
      - ./imageEvaller/images:/usr/src/app/images:ro
      - ./imageViewer:/var/www/html
    ports:
      - 7090:80
    depends_on:
      - db
      - memcached
    command: php-cli artisan octane:frankenphp

  img-server:
    image: ghcr.io/mkaraki/illuststore-viewer:head
    build: imageServer
    volumes:
      - ./imageEvaller/images:/usr/src/app/images:ro
    ports:
      - 7092:8080
    depends_on:
      - db

  db:
    image: mariadb
    ports:
      - 7091:3306
    environment:
      - MARIADB_ALLOW_EMPTY_ROOT_PASSWORD=yes
      - MARIADB_DATABASE=illustStore
      - MARIADB_USER=illustStore
      - MARIADB_PASSWORD=illustStore
    volumes:
      - ./dbdebug:/var/lib/mysql:Z
      - ./init.db:/docker-entrypoint-initdb.d:ro

  memcached:
    image: memcached:1.6-alpine
    command: memcached -m 1024
