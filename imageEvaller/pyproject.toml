[project]
name = "imageEvaller"
dynamic = ["version"]
# https://www.tensorflow.org/install/pip#software_requirements
# Uses 3.10 as minimum version because mysql-connector-python does not support Python 3.9
requires-python = ">=3.10,<3.13"
dependencies = [
    "deepdanbooru==1.0.4",
    "tensorflow==2.20.0",
    "tensorflow-io==0.37.1",
    "mysql-connector-python==9.5.0",
    "ImageHash==4.3.2",
    "sentry-sdk==2.46.0",
]

[tool.setuptools]
py-modules = []
